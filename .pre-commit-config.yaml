default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: pyright
        name: strict pyright
        entry: uv run python scripts/verify.py typecheck
        language: system
        pass_filenames: false
      - id: configuration-schema
        name: configuration schema current
        entry: uv run python scripts/verify.py check-config
        language: system
        pass_filenames: false
      - id: secret-patterns
        name: common secret patterns
        entry: '(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)[ :=]+[A-Za-z0-9_/-]{16,}'
        language: pygrep
        exclude: '^(\.env\.example|tests/)'

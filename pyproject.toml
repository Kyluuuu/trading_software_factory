[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mnq-system"
version = "0.1.0"
description = "Safety-critical foundation for MNQ futures research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars==4.13.3",
  "lightgbm==4.7.0",
  "pyarrow==26.0.1",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "hypothesis==6.170.17",
  "pip-audit==2.10.1",
  "pre-commit==4.7.0",
  "pyarrow-stubs>=20.0.0.20260819",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.6",
  "scikit-learn-stubs>=0.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mnq_system"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "C4", "SIM", "PT", "S", "ARG", "BLE", "DTZ", "TC", "RUF",
]
ignore = [
  "S101", # Assertions are the idiomatic contract in tests.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=mnq_system --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["architecture: architectural boundary tests"]

[tool.coverage.run]
branch = true
source = ["mnq_system"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", '\.\.\.']

[tool.bandit]
recurse = true
targets = ["src", "scripts"]
exclude_dirs = ["tests"]
# No global skips: subprocess findings must be justified at the call site.
skips = []

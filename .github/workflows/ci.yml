name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          version: "0.13.10"
      - name: Locked dependency installation
        run: uv sync --locked --python 3.12
      - name: Verify lock and generated configuration
        run: uv lock --check && uv run python scripts/verify.py check-config
      - name: Formatting and Ruff
        run: uv run python scripts/verify.py lint
      - name: Strict type checking
        run: uv run python scripts/verify.py typecheck
      - name: Architecture tests
        run: uv run python scripts/verify.py architecture
      - name: Tests and coverage
        run: uv run python scripts/verify.py test
      - name: Bandit and dependency audit
        run: uv run python scripts/verify.py security
